[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "kshetrajna"
version = "0.4.3"
description = "Local adaptive workload and file intelligence with consent, evaluation, and rollback"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = {text = "MIT"}
authors = [{name = "Kshetrajna contributors"}]
dependencies = []

[project.scripts]
kshetrajna = "kshetrajna.__main__:main"
kshetrajna-sort = "kshetrajna.cli:main"
kshetrajna-jarvis = "kshetrajna.jarvis:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kshetrajna = ["web/*"]
