name: Native Windows payload qualification
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            architecture: x64
          - os: windows-11-arm
            architecture: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.16'
          architecture: ${{ matrix.architecture }}
      - name: Use candidate commit timestamp
        shell: pwsh
        run: '"SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - name: Require full native source suite, without skips
        run: python scripts/run_native_checks.py --architecture ${{ matrix.architecture }} --report reports/source.json
        env:
          PYTHONPATH: src
      - name: Parse release PowerShell scripts without running installers
        run: python scripts/validate_release_config.py --powershell powershell.exe
      - name: Build and scan the native unsigned payload
        run: python scripts/build_windows_bundle.py --architecture ${{ matrix.architecture }}
      - name: Compare fresh unsigned builds with the exact candidate payload
        run: python scripts/check_reproducible.py --kind windows --architecture ${{ matrix.architecture }} --artifact dist/Kshetrajna-Windows-${{ matrix.architecture }}.zip --report reports/reproducible.json
      - name: Extract only the scanned candidate
        run: Expand-Archive -LiteralPath 'dist/Kshetrajna-Windows-${{ matrix.architecture }}.zip' -DestinationPath 'build/package-smoke'
      - name: Require full suite on the actual packaged interpreter
        run: python scripts/run_native_checks.py --architecture ${{ matrix.architecture }} --bundle build/package-smoke/Kshetrajna --report reports/packaged.json
      - name: Exercise packaged defaults, assets, token/origin guards and graceful quit
        run: python scripts/smoke_windows_bundle.py --bundle build/package-smoke/Kshetrajna --architecture ${{ matrix.architecture }}
      - name: Generate known-component SPDX from actual candidate bytes
        run: python scripts/release_tools.py inventory dist/Kshetrajna-Windows-${{ matrix.architecture }}.zip --output reports/payload.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-native-${{ matrix.architecture }}-${{ github.sha }}
          path: |
            dist/Kshetrajna-Windows-${{ matrix.architecture }}.zip
            dist/Kshetrajna-Windows-${{ matrix.architecture }}.zip.sha256
            reports/source.json
            reports/packaged.json
            reports/reproducible.json
            reports/payload.spdx.json
          if-no-files-found: error
          retention-days: 7
