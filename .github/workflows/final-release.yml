name: Final signed release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: final-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.16'
      - name: Require exact clean version tag and independently protected release environments
        run: |
          python scripts/release_gate.py candidate
          python scripts/release_gate.py environment --environment release-signing
          python scripts/release_gate.py environment --environment release-qualification
          python scripts/release_gate.py environment --environment release-publish
        env:
          GH_TOKEN: ${{ github.token }}
  tests:
    needs: candidate
    uses: ./.github/workflows/tests.yml
  sign:
    needs: [candidate, tests]
    # Provisioned ephemeral Windows signing workers. No identity/account is created by this workflow.
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    runs-on: [self-hosted, Windows, '${{ matrix.architecture }}', kshetrajna-signing-ephemeral]
    environment: release-signing
    timeout-minutes: 30
    env:
      KSHETRAJNA_WIX_EULA_ACCEPTED: ${{ vars.WIX_EULA_ACCEPTED }}
      SIGNING_THUMBPRINT: ${{ vars.AUTHENTICODE_THUMBPRINT }}
      SIGNTOOL_PATH: ${{ vars.SIGNTOOL_PATH }}
      SIGNTOOL_SHA256: ${{ vars.SIGNTOOL_SHA256 }}
      TIMESTAMP_URL: ${{ vars.AUTHENTICODE_TIMESTAMP_URL }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.16'
          architecture: ${{ matrix.architecture }}
      - name: Recheck protected inputs immediately before use
        shell: pwsh
        run: |
          python scripts/release_gate.py candidate
          if ($LASTEXITCODE -ne 0) { throw 'Candidate rejected' }
          python scripts/release_gate.py environment --environment release-signing
          if ($LASTEXITCODE -ne 0) { throw 'Environment rejected' }
          foreach ($name in 'SIGNING_THUMBPRINT','SIGNTOOL_PATH','SIGNTOOL_SHA256','TIMESTAMP_URL') {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing protected input: $name" }
          }
          'KSHETRAJNA_PROTECTED_SIGNING=verified' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-native-${{ matrix.architecture }}-${{ github.sha }}
          path: build/qualified
      - name: Build, audit, sign, and re-audit the exact MSI
        shell: pwsh
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $zip = "build/qualified/dist/Kshetrajna-Windows-$env:ARCHITECTURE.zip"
          $msi = "dist/Kshetrajna-$version-$env:ARCHITECTURE.msi"
          python scripts/build_msi.py --archive $zip --output $msi --work build/msi
          if ($LASTEXITCODE -ne 0) { throw 'MSI compilation failed' }
          python scripts/audit_msi.py --msi $msi --archive $zip
          if ($LASTEXITCODE -ne 0) { throw 'Unsigned MSI audit failed' }
          ./packaging/windows/sign.ps1 -Path $msi -Thumbprint $env:SIGNING_THUMBPRINT -TimestampUrl $env:TIMESTAMP_URL -SignTool $env:SIGNTOOL_PATH -SignToolSha256 $env:SIGNTOOL_SHA256
          python scripts/audit_msi.py --msi $msi --archive $zip
          if ($LASTEXITCODE -ne 0) { throw 'Signed MSI audit failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-${{ matrix.architecture }}-${{ github.sha }}
          path: dist/*.msi
          if-no-files-found: error
          retention-days: 7
  lifecycle:
    needs: [candidate, tests, sign]
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    runs-on: [self-hosted, Windows, '${{ matrix.architecture }}', kshetrajna-standard-user-ephemeral]
    environment: release-qualification
    timeout-minutes: 30
    env:
      # Existing signed predecessor provided locally on the disposable VM; no download/account provisioning.
      PREVIOUS_MSI: ${{ matrix.architecture == 'x64' && vars.PREVIOUS_X64_MSI_PATH || vars.PREVIOUS_ARM64_MSI_PATH }}
      PREVIOUS_MSI_SHA256: ${{ matrix.architecture == 'x64' && vars.PREVIOUS_X64_MSI_SHA256 || vars.PREVIOUS_ARM64_MSI_SHA256 }}
      SIGNING_THUMBPRINT: ${{ vars.AUTHENTICODE_THUMBPRINT }}
      SIGNTOOL_PATH: ${{ vars.SIGNTOOL_PATH }}
      SIGNTOOL_SHA256: ${{ vars.SIGNTOOL_SHA256 }}
      KSHETRAJNA_DISPOSABLE_VM: ${{ vars.DISPOSABLE_VM_APPROVAL }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.16'
          architecture: ${{ matrix.architecture }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-${{ matrix.architecture }}-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-native-${{ matrix.architecture }}-${{ github.sha }}
          path: build/qualified
      - name: Verify trust, perform standard-user lifecycle, assemble exact-artifact evidence
        shell: pwsh
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_gate.py environment --environment release-qualification
          if ($LASTEXITCODE -ne 0) { throw 'Environment rejected' }
          if (-not $env:PREVIOUS_MSI_SHA256 -or (Get-FileHash -LiteralPath $env:PREVIOUS_MSI -Algorithm SHA256).Hash -ne $env:PREVIOUS_MSI_SHA256) { throw 'Missing or changed signed predecessor' }
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $base = "Kshetrajna-$version-$env:ARCHITECTURE"
          $msi = "dist/$base.msi"
          foreach ($path in @($msi, $env:PREVIOUS_MSI)) {
            ./packaging/windows/verify-authenticode.ps1 -Path $path -Thumbprint $env:SIGNING_THUMBPRINT -SignTool $env:SIGNTOOL_PATH -SignToolSha256 $env:SIGNTOOL_SHA256
          }
          python scripts/audit_msi.py --msi $msi --archive "build/qualified/dist/Kshetrajna-Windows-$env:ARCHITECTURE.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Content audit failed' }
          New-Item -ItemType Directory -Force reports | Out-Null
          ./packaging/windows/test-lifecycle.ps1 -Msi $env:PREVIOUS_MSI -UpgradeMsi $msi -Architecture $env:ARCHITECTURE -ExpectedCommit $env:GITHUB_SHA -Report reports/lifecycle.json -DisposableRunner
          python scripts/assemble_release_evidence.py --qualified build/qualified/reports --lifecycle reports/lifecycle.json --msi $msi --archive "build/qualified/dist/Kshetrajna-Windows-$env:ARCHITECTURE.zip" --output "dist/$base.evidence.json" --inventory "dist/$base.spdx.json"
          if ($LASTEXITCODE -ne 0) { throw 'Evidence assembly failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-${{ matrix.architecture }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [candidate, tests, sign, lifecycle]
    runs-on: ubuntu-24.04
    environment: release-publish
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.16'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: final-*-${{ github.sha }}
          merge-multiple: true
          path: dist
      - name: Exact artifacts, version, same-commit evidence, and protected publication
        run: |
          python scripts/release_gate.py environment --environment release-publish
          python scripts/release_gate.py manifest --directory dist
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Issue real CI provenance for the exact release subjects
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*
      - name: Publish only after every gate and attestation succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/publish_release.py --directory dist
