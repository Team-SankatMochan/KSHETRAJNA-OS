name: Tests
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.16'
      - name: Use candidate commit timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Offline standard-library suite
        run: make test PYTHON=python
      - name: Validate release configuration and pinned workflow syntax
        run: python scripts/validate_release_config.py --download-actionlint
      - name: Hash-locked project-local build tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements-build.lock
      - name: Build, scan and exercise the installed wheel
        run: make smoke-wheel PYTHON=.venv/bin/python
      - name: Compare two fresh unsigned wheel builds
        run: .venv/bin/python scripts/check_reproducible.py --kind wheel --artifact dist/kshetrajna-$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')-py3-none-any.whl
      - name: Build and run non-root Docker runtime smoke
        run: make smoke-docker PYTHON=.venv/bin/python
  native:
    uses: ./.github/workflows/windows-bundles.yml
